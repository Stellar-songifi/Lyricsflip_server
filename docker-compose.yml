services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The variable names here are the ones src/config/env.validation.ts reads.
    environment: &app-env
      # Local development stack. NODE_ENV=production would also require a
      # 32+ character JWT_SECRET and STELLAR_WEB_AUTH_SECRET.
      NODE_ENV: ${NODE_ENV:-development}
      # Listen on all interfaces so the published port reaches the API.
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DB_NAME: ${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      # DEVELOPMENT ONLY. Never use this value anywhere reachable from the
      # internet; set JWT_SECRET in your shell or .env to override it.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-production}
      # docker-entrypoint.sh applies pending migrations before starting.
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-off seed: docker compose run --rm seed
  # Uses the build stage, which has the TypeScript sources and ts-node that
  # `npm run seed` needs.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    profiles:
      - seed
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    command: ["npm", "run", "seed"]

  stellar:
    image: stellar/quickstart
    profiles:
      - stellar
    command: ["--local", "--enable-soroban-rpc"]
    ports:
      - "8000:8000"

volumes:
  postgres-data:
  redis-data:
