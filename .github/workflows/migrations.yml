name: Migrations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Migrate an empty database and check for drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricflip
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: lyricflip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run all migrations
        run: npm run migration:run

      # Exits non-zero when the entities describe a schema the migrations do
      # not produce, i.e. an entity change shipped without a migration.
      - name: Check the entities match the migrated schema
        run: npm run migration:check

      # npm run openapi:export builds the app with the same routing and
      # document configuration as main.ts, so its paths are the ones the API
      # serves (#363). If an openapi.json is committed it must match.
      - name: Export the OpenAPI document
        run: |
          JWT_SECRET="$(openssl rand -hex 32)" \
            npm run openapi:export -- "$RUNNER_TEMP/openapi.json"

      - name: Committed openapi.json is up to date
        run: |
          if git ls-files --error-unmatch openapi.json >/dev/null 2>&1; then
            diff -u openapi.json "$RUNNER_TEMP/openapi.json" || {
              echo "openapi.json is out of date: run npm run openapi:export and commit it." >&2
              exit 1
            }
          else
            echo "No openapi.json is committed; nothing to compare."
          fi

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi.json
