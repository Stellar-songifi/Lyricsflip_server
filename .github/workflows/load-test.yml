name: Load Test

on:
  workflow_dispatch:
    inputs:
      vus:
        description: 'Number of virtual users'
        required: false
        default: '10'
      duration:
        description: 'Scenario duration (e.g. 30s)'
        required: false
        default: '30s'

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "app is up"; exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy"; docker compose logs; exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load test
        env:
          BASE_URL: http://localhost:3000
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
        run: |
          mkdir -p load-results
          k6 run --summary-export=load-results/summary.json load/smoke.js

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: load-results/

      - name: Stop compose stack
        if: always()
        run: docker compose down -v
