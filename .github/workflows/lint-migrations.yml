name: Migration location

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-location:
    name: No migrations outside src/migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-migration-location.sh

  lint-typecheck-test-build:
    name: Lint, type-check, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (check mode)
        run: npm run lint -- --no-fix
      - name: Type-check
        run: npx tsc --noEmit
      - name: Dead code report (knip, report only)
        run: npx --yes knip@5 --include files,exports || true
      - name: Tests with coverage
        run: npm test -- --coverage
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Postgres) and migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Migration drift check
        run: npm run migration:check
      - name: E2E tests
        run: npm run test:e2e

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Contract tests
        run: npm run test:contract
