name: CI

on:
  push:
    branches:
      - main
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        include:
          - node: 22
            experimental: false
          - node: 24
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present
      # Blocking: an unused file or export fails the PR (#452).
      - name: Dead code check (knip)
        run: npx knip

      # Fails when a package is imported but not declared in package.json
      # (e.g. nodemailer, csv-parse, @types/multer): the image would crash
      # with MODULE_NOT_FOUND on the first require (#424).
      - name: Undeclared dependencies (knip unlisted)
        run: npx --yes knip@5 --include unlisted

      # Thresholds live in jest.config.js and are enforced by Jest itself, so
      # a PR that lowers coverage below them fails here (#524).
      - name: Tests with coverage
        run: npm test -- --coverage

      # Surface the per-path coverage on the PR so reviewers can see the
      # ratchet targets without opening the job log (#524).
      - name: Comment per-path coverage on the PR
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary produced; skipping PR comment."
            exit 0
          fi
          body=$(node -e '
            const s = require("./coverage/coverage-summary.json");
            const paths = ["total", "src/tokens", "src/stellar", "src/auth"];
            const rows = paths.map((p) => {
              const key = Object.keys(s).find((k) => k === p || k.endsWith("/" + p));
              const m = key ? s[key] : null;
              const pct = (v) => (m && v ? v.pct + "%" : "n/a");
              return `| ${p} | ${pct(m && m.lines)} | ${pct(m && m.statements)} | ${pct(m && m.functions)} | ${pct(m && m.branches)} |`;
            });
            process.stdout.write(
              "### Coverage (per path)\n\n" +
              "| Path | Lines | Statements | Functions | Branches |\n" +
              "| --- | --- | --- | --- | --- |\n" +
              rows.join("\n") +
              "\n\nThresholds are enforced by `jest.config.js`; a drop below them fails CI.\n"
            );
          ')
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"

      - name: Build
        run: npm run build --if-present
        run: npm run build

      # The compiled app must load: a bare src/... import builds fine but
      # crashes `node dist/main` (#355).
      - name: Start the compiled build (smoke test)
        run: bash scripts/smoke-start.sh

  # Advisory only (#455): warns when a PR changes many lines in a file its
  # linked issue does not name. Never fails the build.
  scope-warning:
    name: PR scope warning
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      # Files outside the issue's list may change up to this many lines.
      SCOPE_MAX_LINES: '40'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Warn on out-of-scope changes
        run: |
          set -euo pipefail
          issue=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | grep -oiE '(closes|fixes|resolves|refs?)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          if [ -z "${issue:-}" ]; then
            echo "No linked issue found in the PR body; skipping scope check."
            exit 0
          fi
          echo "Linked issue: #$issue"

          body=$(gh api "repos/$REPO/issues/$issue" --jq '.body // ""')
          # The issue lists its files as backticked paths under a "Files:" line.
          allowed=$(printf '%s\n' "$body" | grep -iE '^\s*\*?\*?Files' | grep -oE '`[^`]+`' | tr -d '`' | sort -u || true)
          echo "Files named by the issue:"
          printf '%s\n' "$allowed"

          git diff --numstat "$BASE_SHA" "$HEAD_SHA" > numstat.txt
          warned=0
          while IFS=$'\t' read -r added deleted file; do
            [ -n "${file:-}" ] || continue
            [ "$file" = "numstat.txt" ] && continue
            if printf '%s\n' "$allowed" | grep -qxF "$file"; then
              continue
            fi
            changed=$(( ${added:-0} + ${deleted:-0} ))
            if [ "$changed" -gt "$SCOPE_MAX_LINES" ]; then
              echo "::warning file=$file::Changes $changed lines in $file, which issue #$issue does not list. Explain this in the PR."
              warned=1
            fi
          done < numstat.txt
          if [ "$warned" -eq 0 ]; then
            echo "All out-of-scope changes are within $SCOPE_MAX_LINES lines."
          fi

  docker-build:
    name: Docker image builds and migrates an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build only, never push: a broken Dockerfile fails the PR (#352).
      - name: Build image
        run: docker build --tag lyricsflip-server:ci .

      - name: Image contains the compiled data source and entrypoint
        run: |
          docker run --rm --entrypoint sh lyricsflip-server:ci -c \
            'test -f dist/main.js && test -f dist/data-source.js && test -x docker-entrypoint.sh && ls dist/migrations | head -n 3'

      - name: Run with RUN_MIGRATIONS=true against the empty database
        run: |
          docker run -d --name api --network host \
            -e RUN_MIGRATIONS=true -e PORT=3000 \
            -e JWT_SECRET=ci-secret-that-is-at-least-32-characters-long \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            lyricsflip-server:ci

      - name: Wait for the API to become healthy
        run: |
          if git ls-files --error-unmatch openapi.json >/dev/null 2>&1; then
            diff -u openapi.json "$RUNNER_TEMP/openapi.json" || {
              echo "openapi.json is out of date: run npm run openapi:export and commit it." >&2
              exit 1
            }
          else
            echo "No openapi.json is committed; nothing to compare."
          fi

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi.json

      - name: Generate, type-check and pack the API client
        working-directory: clients/typescript
        run: |
          npm ci
          npm run generate -- "$RUNNER_TEMP/openapi.json" -o src/schema.ts
          npm run check
          npm run build
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a version tag such as v1.2.3."
              exit 1
            fi
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          fi
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Upload the API client package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-client
          path: ${{ runner.temp }}/lyricsflip-api-client-*.tgz

  publish-api-client:
    name: Publish the API client to npm
    if: github.repository == 'Stellar-songifi/Lyricsflip_server' && startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, lint-typecheck-test-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: api-client
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Publish the generated tarball
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; fi
          npm publish ./lyricsflip-api-client-*.tgz --access public --tag "$tag"

  contract:
    name: Escrow contract (tests and release build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          # Pinned to a SHA, so the toolchain can no longer come from the ref name.
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Contract tests
        working-directory: contracts
        run: cargo test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              echo "API is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time."
          docker logs api || true
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f api || true
