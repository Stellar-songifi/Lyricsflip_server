name: CI

# Every check runs once per PR, from this one workflow. The Node version
# comes from .nvmrc (also engines.node in package.json and the Dockerfile).

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-location:
    name: No migrations outside src/migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migration location
        run: bash scripts/check-migration-location.sh

  lint-typecheck-test-build:
    name: Lint, type-check, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (check mode)
        run: npm run lint:check

      - name: Type-check
        run: npx tsc --noEmit
      - name: Dead code report (knip, report only)
        run: npx --yes knip@5 --include files,exports || true

      - name: Tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      # The compiled app must load: a bare src/... import builds fine but
      # crashes `node dist/main` (#355).
      - name: Start the compiled build (smoke test)
        run: bash scripts/smoke-start.sh

  docker-build:
    name: Docker image builds and migrates an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build only, never push: a broken Dockerfile fails the PR (#352).
      - name: Build image
        run: docker build --tag lyricsflip-server:ci .

      - name: Image contains the compiled data source and entrypoint
        run: |
          docker run --rm --entrypoint sh lyricsflip-server:ci -c \
            'test -f dist/main.js && test -f dist/data-source.js && test -x docker-entrypoint.sh && ls dist/migrations | head -n 3'

      - name: Run with RUN_MIGRATIONS=true against the empty database
        run: |
          docker run -d --name api --network host \
            -e RUN_MIGRATIONS=true -e PORT=3000 \
            -e JWT_SECRET=ci-secret-that-is-at-least-32-characters-long \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres -e DB_NAME=lyricsflip \
            lyricsflip-server:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health/live; then echo; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then break; fi
            sleep 2
          done
          docker logs api
          curl -fsS http://127.0.0.1:3000/health/live
          applied=$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d lyricsflip -tAc 'SELECT count(*) FROM migrations')
          echo "migrations applied: $applied"
          test "$applied" -gt 0

  e2e:
    name: Migrations, drift check and E2E (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    timeout-minutes: 5
    # The variables typeorm.config.ts, AppModule and the e2e setup read.
    # DATABASE_URL takes precedence over the discrete DB_* values.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      TZ: America/New_York
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all migrations on an empty database
        run: npm run migration:run

      # Exits non-zero when the entities describe a schema the migrations do
      # not produce, i.e. an entity change shipped without a migration.
      - name: Check the entities match the migrated schema
        run: npm run migration:check

      - name: E2E tests
        run: npm run test:e2e

      - name: E2E tests (real Postgres)
        run: npm run test:e2e:db

      # npm run openapi:export builds the app with the same routing and
      # document configuration as main.ts, so its paths are the ones the API
      # serves (#363). If an openapi.json is committed it must match.
      - name: Export the OpenAPI document
        run: |
          JWT_SECRET="$(openssl rand -hex 32)" \
            npm run openapi:export -- "$RUNNER_TEMP/openapi.json"

      - name: Committed openapi.json is up to date
        run: |
          if git ls-files --error-unmatch openapi.json >/dev/null 2>&1; then
            diff -u openapi.json "$RUNNER_TEMP/openapi.json" || {
              echo "openapi.json is out of date: run npm run openapi:export and commit it." >&2
              exit 1
            }
          else
            echo "No openapi.json is committed; nothing to compare."
          fi

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi.json

  contract:
    name: Escrow contract (tests and release build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Contract tests
        working-directory: contracts
        run: cargo test

      - name: Release build (wasm)
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown
